<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Days Between Dates Calculator | daysbetweendays</title>
  <meta name="description" content="Free calculator that shows how many days there are between two dates, in days, weeks, months and years.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">daysbetweendays</a>
  </header>

  <div class="layout">
    <!-- Left sidebar ad: paste your ad code inside this div -->
    <aside class="ad side side-left" aria-label="Advertisement">Ad 160×600</aside>

    <main class="main">
      <h1>How many days apart?</h1>
      <p class="lead">Choose two dates and see the gap.</p>

      <form class="calc" id="calc" novalidate>
        <div class="field">
          <label for="start">From</label>
          <input id="start" name="start" type="date">
        </div>
        <div class="field">
          <label for="end">To</label>
          <input id="end" name="end" type="date">
        </div>
        <button type="submit" class="btn">Count days</button>
      </form>

      <section class="result" aria-live="polite">
        <p class="error" id="error" hidden></p>
        <div class="big">
          <span class="num" id="days">–</span>
          <span class="unit" id="unit">days</span>
        </div>
        <div class="pills">
          <span class="pill" id="weeks" hidden></span>
          <span class="pill" id="ymd" hidden></span>
        </div>
      </section>
    </main>

    <!-- Right sidebar ad: paste your ad code inside this div -->
    <aside class="ad side side-right" aria-label="Advertisement">Ad 160×600</aside>
  </div>

  <!-- Bottom banner ad: paste your ad code inside this div -->
  <div class="ad-row">
    <div class="ad banner" aria-label="Advertisement">Ad 728×90</div>
  </div>

  <footer class="site-footer">
    <a href="/about.html">About</a>
    <a href="/privacy.html">Privacy</a>
    <a href="/contact.html">Contact</a>
  </footer>

  <script>
    (function () {
      var form = document.getElementById('calc');
      var startEl = document.getElementById('start');
      var endEl = document.getElementById('end');
      var daysEl = document.getElementById('days');
      var unitEl = document.getElementById('unit');
      var weeksEl = document.getElementById('weeks');
      var ymdEl = document.getElementById('ymd');
      var errorEl = document.getElementById('error');

      function parse(value) {
        var p = value.split('-');
        return { y: +p[0], m: +p[1], d: +p[2], t: Date.UTC(+p[0], +p[1] - 1, +p[2]) };
      }

      function plural(n, word) {
        return n + ' ' + word + (n === 1 ? '' : 's');
      }

      function reset() {
        daysEl.textContent = '–';
        unitEl.textContent = 'days';
        weeksEl.hidden = true;
        ymdEl.hidden = true;
      }

      function calculate() {
        errorEl.hidden = true;
        if (!startEl.value || !endEl.value) {
          reset();
          if (startEl.value || endEl.value) {
            errorEl.textContent = 'Choose both dates to see the result.';
            errorEl.hidden = false;
          }
          return;
        }

        var a = parse(startEl.value);
        var b = parse(endEl.value);
        if (b.t < a.t) { var tmp = a; a = b; b = tmp; }

        var total = Math.round((b.t - a.t) / 86400000);

        var years = b.y - a.y;
        var months = b.m - a.m;
        var days = b.d - a.d;
        if (days < 0) {
          months -= 1;
          days += new Date(Date.UTC(b.y, b.m - 1, 0)).getUTCDate();
        }
        if (months < 0) { years -= 1; months += 12; }

        var weeks = Math.floor(total / 7);
        var remDays = total % 7;

        daysEl.textContent = total.toLocaleString('en-GB');
        unitEl.textContent = total === 1 ? 'day' : 'days';

        weeksEl.textContent = plural(weeks, 'week') + ', ' + plural(remDays, 'day');
        weeksEl.hidden = false;

        var parts = [];
        if (years) parts.push(plural(years, 'year'));
        if (months) parts.push(plural(months, 'month'));
        if (days || !parts.length) parts.push(plural(days, 'day'));
        ymdEl.textContent = parts.join(', ');
        ymdEl.hidden = false;
      }

      form.addEventListener('submit', function (e) { e.preventDefault(); calculate(); });
      startEl.addEventListener('change', calculate);
      endEl.addEventListener('change', calculate);
    })();
  </script>
</body>
</html>
